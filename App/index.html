<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>GridPilot</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reconcile.css"><link rel="stylesheet" href="sort.css"></head>
<body><aside><div class="brand"><span class="brandmark">G</span>GridPilot<span class="version">1.6</span></div><div class="eyebrow">工作簿工具</div><nav id="nav"></nav><div class="local"><span class="dot"></span>本地处理 · 离线可用<p>源工作簿保持原样<br>处理结果另存为新文件</p></div></aside><main><header><div><div class="eyebrow" id="eyebrow">准备就绪</div><h1 id="title">正在连接工作簿…</h1><p id="subtitle">读取本地设置</p></div><button id="close" class="quiet">关闭 <kbd>Esc</kbd></button></header><div id="content"></div><footer><div class="footer-status"><div id="progressWrap" hidden><progress id="progressFill" max="100" value="0"></progress><span id="progressMeta"></span></div><div id="status" role="status" aria-live="polite">正在加载…</div></div><div id="actions"></div></footer></main><dialog id="preview"><div class="dialog-head"><div><div class="eyebrow">本地预览</div><h2>确认替换结果</h2></div><button id="dismiss" class="quiet">返回调整</button></div><p id="summary"></p><div class="toolbar"><input id="previewSearch" type="search" placeholder="搜索位置、原值或替代值" aria-label="搜索脱敏预览"><button id="previewSearchButton">搜索</button><select id="previewSize" aria-label="预览每页条数"><option value="100">每页 100 条</option><option value="200">每页 200 条</option></select></div><div class="preview-table"><table><thead><tr><th>位置</th><th>原值</th><th>替代值</th></tr></thead><tbody id="previewRows"></tbody></table></div><div class="toolbar"><button id="previewPrev">上一页</button><span id="previewPageInfo"></span><button id="previewNext">下一页</button></div><div class="toolbar"><label>复制工作表 <select id="copySheet"></select></label><label>起始行 <input id="copyFirst" type="number" value="1" min="1"></label><label>结束行 <input id="copyLast" type="number" min="1"></label><button id="copyMask" title="复制脱敏后的表格内容" aria-label="复制脱敏结果">⧉ 复制</button></div><p class="help">复制所选工作表的结果值，单次最多 20,000 行；含保留字段，不复制公式或样式。</p><label class="confirm"><input id="confirmed" type="checkbox">我已检查字段规则、预览和保留信息</label><div id="exportProgress" role="status"></div><button id="cancelExport">取消导出</button><button id="export" class="primary">验证并另存新文件</button></dialog><script src="reconcile-renderer.js"></script><script src="database-renderer.js"></script><script src="simple-mask.js"></script><script src="sort-renderer.js"></script><script src="renderer.js"></script></body></html>
