<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>GridPilot</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand"><span class="brandmark">G</span>GridPilot<span class="version">1.0</span></div><div class="eyebrow">工作簿工具</div><nav id="nav"></nav><div class="local"><span class="dot"></span>本地处理 · 离线可用<p>源工作簿保持原样<br>处理结果另存为新文件</p></div></aside><main><header><div><div class="eyebrow" id="eyebrow">准备就绪</div><h1 id="title">正在连接工作簿…</h1><p id="subtitle">读取本地设置</p></div><button id="close" class="quiet">关闭 <kbd>Esc</kbd></button></header><div id="content"></div><footer><div class="footer-status"><div id="progressWrap" hidden><progress id="progressFill" max="100" value="0"></progress><span id="progressMeta"></span></div><div id="status" role="status" aria-live="polite">正在加载…</div></div><div id="actions"></div></footer></main><dialog id="preview"><div class="dialog-head"><div><div class="eyebrow">本地预览</div><h2>确认替换结果</h2></div><button id="dismiss" class="quiet">返回调整</button></div><p id="summary"></p><div class="preview-table"><table><thead><tr><th>位置</th><th>原值</th><th>替代值</th></tr></thead><tbody id="previewRows"></tbody></table></div><label class="confirm"><input id="confirmed" type="checkbox">我已检查字段规则、预览和保留信息</label><div id="exportProgress" role="status"></div><button id="cancelExport">取消导出</button><button id="export" class="primary">验证并另存新文件</button></dialog><script src="renderer.js"></script></body></html>
